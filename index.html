<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f6">
<title>股票損益帳本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 60px}h1{font-size:27px;margin:5px 0}h2{font-size:18px;margin:0 0 14px}
small,.hint{color:#71717a}.card{background:white;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0000000a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{font-size:13px;color:#71717a;display:block;margin-bottom:5px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid #d4d4d8;border-radius:11px;background:white}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:11px;background:#18181b;color:white}
.secondary{background:#e4e4e7;color:#18181b}.danger{background:#fee2e2;color:#991b1b}.wide{width:100%}.buttons{display:flex;gap:8px}.buttons>*{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#f7f7f8;border-radius:13px;padding:12px}.stat small{display:block;margin-bottom:6px}.stat b{font-size:19px}.positive{color:#15803d}.negative{color:#dc2626}
#status{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:700}
.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px;font-size:13px}th,td{border-bottom:1px solid #e4e4e7;padding:9px 6px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.mini{padding:6px 8px;font-size:12px}.hint{font-size:12px;line-height:1.55;margin-top:10px}
@media(max-width:540px){.grid{grid-template-columns:1fr}.stat b{font-size:17px}}
</style>
</head>
<body>
<main>
<h1>📈 股票損益帳本</h1>
<small>全新重寫版 · 只記股票市值，不記帳戶現金</small>

<div class="card">
<h2 id="formTitle">新增紀錄</h2>
<div class="grid">
<div><label>日期</label><input id="date" type="date"></div>
<div><label>股票總市值</label><input id="market" type="number" inputmode="decimal" placeholder="例如 340182"></div>
<div><label>今日買進</label><input id="buy" type="number" inputmode="decimal" value="0"></div>
<div><label>今日賣出</label><input id="sell" type="number" inputmode="decimal" value="0"></div>
<div><label>今日股息</label><input id="dividend" type="number" inputmode="decimal" value="0"></div>
</div>
<p class="hint">損益＝本次市值－前次市值－買進＋賣出＋股息。第一筆是基準日。</p>
<div class="buttons"><button type="button" id="saveBtn">儲存紀錄</button><button type="button" id="cancelBtn" class="secondary" hidden>取消編輯</button></div>
<div id="status"></div>
</div>

<div class="card">
<h2>查詢</h2>
<div class="grid">
<div><label>月份</label><select id="monthFilter"></select></div>
<div><label>年度</label><select id="yearFilter"></select></div>
</div>
</div>

<div class="card">
<h2>月份統計</h2>
<div class="stats">
<div class="stat"><small>月份損益</small><b id="monthProfit">—</b></div>
<div class="stat"><small>買進總額</small><b id="monthBuy">—</b></div>
<div class="stat"><small>賣出總額</small><b id="monthSell">—</b></div>
<div class="stat"><small>淨買進</small><b id="monthNet">—</b></div>
<div class="stat"><small>股息</small><b id="monthDividend">—</b></div>
<div class="stat"><small>最新股票市值</small><b id="latestMarket">—</b></div>
</div>
</div>

<div class="card">
<h2>年度統計</h2>
<div class="stats">
<div class="stat"><small>年度損益</small><b id="yearProfit">—</b></div>
<div class="stat"><small>年度買進</small><b id="yearBuy">—</b></div>
<div class="stat"><small>年度賣出</small><b id="yearSell">—</b></div>
<div class="stat"><small>年度股息</small><b id="yearDividend">—</b></div>
</div>
</div>

<div class="card">
<h2>歷史紀錄</h2>
<div class="table"><table>
<thead><tr><th>日期</th><th>市值</th><th>買進</th><th>賣出</th><th>股息</th><th>損益</th><th>操作</th></tr></thead>
<tbody id="tbody"></tbody>
</table></div>
</div>

<div class="card">
<h2>資料備份</h2>
<div class="buttons"><button type="button" id="exportBtn" class="secondary">匯出備份</button><button type="button" id="importBtn" class="secondary">匯入備份</button></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<p class="hint">資料儲存在目前瀏覽器／主畫面 App。換手機或清除網站資料前請先匯出。</p>
</div>
</main>

<script>
(function(){
"use strict";

var DB_KEY = "stock-ledger-clean-v1";
var records = [];
var editingDate = null;

function el(id){ return document.getElementById(id); }
function num(v){ var n=Number(v); return isFinite(n)?n:0; }
function money(v){ return new Intl.NumberFormat("zh-TW",{maximumFractionDigits:0}).format(v)+" 元"; }
function signed(v){ return (v>=0?"+":"")+money(v); }

function readDB(){
  try{
    var raw=window.localStorage.getItem(DB_KEY);
    var parsed=raw?JSON.parse(raw):[];
    return Array.isArray(parsed)?parsed:[];
  }catch(e){
    alert("讀取資料失敗："+e.message);
    return [];
  }
}
function writeDB(data){
  try{
    window.localStorage.setItem(DB_KEY,JSON.stringify(data));
    var check=window.localStorage.getItem(DB_KEY);
    if(!check) throw new Error("寫入後無法讀回資料");
    return true;
  }catch(e){
    alert("手機無法儲存資料："+e.message);
    return false;
  }
}
function sorted(){
  return records.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
}
function calculated(){
  var a=sorted();
  return a.map(function(r,i){
    var p=null;
    if(i>0) p=r.market-a[i-1].market-r.buy+r.sell+r.dividend;
    return {date:r.date,market:r.market,buy:r.buy,sell:r.sell,dividend:r.dividend,profit:p};
  });
}
function today(){
  var d=new Date(), y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function resetForm(){
  editingDate=null;
  el("formTitle").textContent="新增紀錄";
  el("saveBtn").textContent="儲存紀錄";
  el("cancelBtn").hidden=true;
  el("date").value=today();
  el("market").value="";
  el("buy").value="0";
  el("sell").value="0";
  el("dividend").value="0";
}
function saveRecord(){
  var date=el("date").value;
  var marketText=el("market").value;
  if(!date || marketText===""){ alert("請填日期與股票總市值"); return; }

  var r={
    date:date,
    market:num(marketText),
    buy:num(el("buy").value),
    sell:num(el("sell").value),
    dividend:num(el("dividend").value)
  };
  if(r.market<0||r.buy<0||r.sell<0||r.dividend<0){alert("金額不能小於 0");return;}

  var next=records.filter(function(x){
    if(editingDate) return x.date!==editingDate && x.date!==date;
    return x.date!==date;
  });
  next.push(r);
  next.sort(function(a,b){return a.date.localeCompare(b.date);});

  if(!writeDB(next)) return;
  records=next;
  resetForm();
  render();
  el("status").textContent="✓ 已成功儲存";
  el("status").style.display="block";
  setTimeout(function(){el("status").style.display="none";},1800);
}
function editRecord(date){
  var r=records.find(function(x){return x.date===date;});
  if(!r)return;
  editingDate=date;
  el("date").value=r.date; el("market").value=r.market; el("buy").value=r.buy; el("sell").value=r.sell; el("dividend").value=r.dividend;
  el("formTitle").textContent="編輯 "+date;
  el("saveBtn").textContent="儲存修改";
  el("cancelBtn").hidden=false;
  window.scrollTo(0,0);
}
function deleteRecord(date){
  if(!confirm("確定刪除 "+date+"？"))return;
  var next=records.filter(function(x){return x.date!==date;});
  if(writeDB(next)){records=next;render();}
}
function fillFilters(data){
  var months=[...new Set(data.map(function(x){return x.date.slice(0,7);}))]
    .sort().reverse();
  var years=[...new Set(data.map(function(x){return x.date.slice(0,4);}))]
    .sort().reverse();
  var oldM=el("monthFilter").value, oldY=el("yearFilter").value;
  el("monthFilter").innerHTML=months.length?months.map(function(m){return '<option value="'+m+'">'+m.replace("-"," 年 ")+' 月</option>';}).join(""):'<option value="">尚無資料</option>';
  el("yearFilter").innerHTML=years.length?years.map(function(y){return '<option value="'+y+'">'+y+' 年</option>';}).join(""):'<option value="">尚無資料</option>';
  if(months.indexOf(oldM)>=0)el("monthFilter").value=oldM;
  if(years.indexOf(oldY)>=0)el("yearFilter").value=oldY;
}
function setStat(id,value,signedMode){
  var e=el(id); e.textContent=signedMode?signed(value):money(value);
  if(signedMode)e.className=value>=0?"positive":"negative"; else e.className="";
}
function renderStats(data){
  if(!data.length){
    ["monthProfit","monthBuy","monthSell","monthNet","monthDividend","latestMarket","yearProfit","yearBuy","yearSell","yearDividend"].forEach(function(id){el(id).textContent="—";});
    return;
  }
  var month=el("monthFilter").value||data[data.length-1].date.slice(0,7);
  var year=el("yearFilter").value||data[data.length-1].date.slice(0,4);
  var ma=data.filter(function(x){return x.date.slice(0,7)===month;});
  var ya=data.filter(function(x){return x.date.slice(0,4)===year;});
  function sum(a,k){return a.reduce(function(s,x){return s+(x[k]||0);},0);}
  setStat("monthProfit",sum(ma,"profit"),true);
  setStat("monthBuy",sum(ma,"buy"),false);
  setStat("monthSell",sum(ma,"sell"),false);
  setStat("monthNet",sum(ma,"buy")-sum(ma,"sell"),true);
  setStat("monthDividend",sum(ma,"dividend"),false);
  el("latestMarket").textContent=money(data[data.length-1].market);
  setStat("yearProfit",sum(ya,"profit"),true);
  setStat("yearBuy",sum(ya,"buy"),false);
  setStat("yearSell",sum(ya,"sell"),false);
  setStat("yearDividend",sum(ya,"dividend"),false);
}
function renderTable(data){
  var body=el("tbody");
  if(!data.length){body.innerHTML='<tr><td colspan="7" style="text-align:center;color:#71717a">尚無紀錄</td></tr>';return;}
  body.innerHTML=data.slice().reverse().map(function(r){
    var pc=r.profit===null?"":(r.profit>=0?"positive":"negative");
    var pt=r.profit===null?"基準日":signed(r.profit);
    return '<tr><td>'+r.date+'</td><td>'+money(r.market)+'</td><td>'+money(r.buy)+'</td><td>'+money(r.sell)+'</td><td>'+money(r.dividend)+'</td><td class="'+pc+'">'+pt+'</td><td><button type="button" class="secondary mini edit" data-date="'+r.date+'">編輯</button> <button type="button" class="danger mini del" data-date="'+r.date+'">刪除</button></td></tr>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".edit"),function(b){b.addEventListener("click",function(){editRecord(this.getAttribute("data-date"));});});
  Array.prototype.forEach.call(document.querySelectorAll(".del"),function(b){b.addEventListener("click",function(){deleteRecord(this.getAttribute("data-date"));});});
}
function render(){
  var data=calculated();
  fillFilters(data);
  renderStats(data);
  renderTable(data);
}
function exportData(){
  var blob=new Blob([JSON.stringify({version:1,records:records},null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="股票損益備份.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var j=JSON.parse(reader.result), arr=Array.isArray(j)?j:j.records;
      if(!Array.isArray(arr))throw new Error("不是有效的備份檔");
      if(confirm("匯入會覆蓋目前資料，確定嗎？")){
        if(writeDB(arr)){records=arr;render();alert("匯入完成");}
      }
    }catch(e){alert("匯入失敗："+e.message);}
  };
  reader.readAsText(file);
}

el("saveBtn").addEventListener("click",saveRecord);
el("cancelBtn").addEventListener("click",resetForm);
el("monthFilter").addEventListener("change",function(){renderStats(calculated());});
el("yearFilter").addEventListener("change",function(){renderStats(calculated());});
el("exportBtn").addEventListener("click",exportData);
el("importBtn").addEventListener("click",function(){el("importFile").click();});
el("importFile").addEventListener("change",function(){if(this.files&&this.files[0])importData(this.files[0]);});

records=readDB();
resetForm();
render();
})();
</script>
</body></html>
